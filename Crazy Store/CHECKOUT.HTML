<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Checkout - The Crazy Store</title>
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!--  header -->
  <header class="header">
    <div class="container nav-container">
      <div class="logo">
        <img src="images/logo.png" alt="The Crazy Store Logo" class="logo-img" />
        <h1>The Crazy Store</h1>
      </div>

      <nav class="nav" id="nav-menu" aria-label="Primary Navigation">
        <ul class="nav-list" id="nav-list">
          <li><a href="index.html" class="nav-link"><i class='bx bx-home'></i> Home</a></li>
          <li><a href="about us.html" class="nav-link"><i class='bx bx-info-circle'></i> About Us</a></li>
          <li><a href="contact us.html" class="nav-link"><i class='bx bx-envelope'></i> Contact Us</a></li>
          <li><a href="products .html" class="nav-link"><i class='bx bx-store'></i> Products</a></li>
          <li><a href="online store.html" class="nav-link active"><i class='bx bx-cart'></i> Online Shopping</a></li>
           <li><a href="gallery.html" class="nav-link active"><i class='bx bx-images'></i> Gallery</a></li>
        </ul>
      </nav>

      <button class="hamburger" id="hamburger" aria-label="Toggle menu">
        <i class='bx bx-menu'></i>
      </button>
    </div>
  </header>

  <!--  main checkout content -->
  <main>
    <h1>Checkout</h1>

    <section id="checkout-cart">
      <h2>Your Cart</h2>
      <ul id="checkout-items"></ul> 
      <p><strong>Total: R<span id="checkout-total">0.00</span></strong></p>
    </section>

    <form id="checkout-form">
      <label>
        Full Name
        <input type="text" name="name" required />
      </label>
      <label>
        Email Address
        <input type="email" name="email" required />
      </label>
      <label>
        Delivery Address
        <textarea name="address" rows="4" required></textarea>
      </label>
      <button type="submit">Place Order</button>
    </form>

    <div id="confirmation" style="display: none;">
      <h3>Thank you! 🎉</h3>
      <p>Your order has been placed successfully.</p>
    </div>
  </main>

  <!--  script must load the cart and handle checkout -->
  <script>
    const cart = JSON.parse(localStorage.getItem('cart')) || [];

    function updateCartDisplay() {
      const list = document.getElementById('checkout-items');
      const totalEl = document.getElementById('checkout-total');
      list.innerHTML = '';
      let total = 0;

      cart.forEach(item => {
        const itemTotal = item.price * item.quantity;
        total += itemTotal;

        const li = document.createElement('li');
        li.textContent = `${item.name} (x${item.quantity}) - R${itemTotal.toFixed(2)}`;
        list.appendChild(li);
      });

      totalEl.textContent = total.toFixed(2);
    }

    updateCartDisplay();

    document.getElementById('checkout-form').addEventListener('submit', function (e) {
      e.preventDefault();

      // send data to server here

      // Clear cart
      localStorage.removeItem('cart');
      document.getElementById('checkout-form').style.display = 'none';
      document.getElementById('checkout-cart').style.display = 'none';
      document.getElementById('confirmation').style.display = 'block';
    });
  </script>

</body>
<footer>
      <section id="location" style="padding: 2rem;">
  <h2 style="margin-bottom: 0.5rem;">Visit Our Store</h2>
  <p>Find us at your nearest Crazy Store location!</p>

  <div style="margin-top: 1rem; border: 2px solid #ccc;">
    <iframe
      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3309.716847733322!2d18.423300115207516!3d-33.918861980642754!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x1dcc5d20d6c83d01%3A0x8b08ac95b0c0416d!2sThe%20Crazy%20Store!5e0!3m2!1sen!2sza!4v1685251199994!5m2!1sen!2sza"
      width="100%"
      height="400"
      style="border:0;"
      allowfullscreen=""
      loading="lazy"
      referrerpolicy="no-referrer-when-downgrade">
    </iframe>
  </div>
</section>
</footer>
</html>
